<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 672" font-family="-apple-system,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Noto Serif CJK TC',sans-serif" role="img" aria-label="AgentBot 執行期拓樸（三程序）">
  <defs>
    <style>
      .h{font-weight:700;font-size:15px;fill:#1f2937}
      .s{font-size:12px;fill:#586577}
      .lab{font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
      .proc{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 6}
      .tag{font:700 11px ui-monospace,monospace}
      .flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:9 7;animation:dash .9s linear infinite}
      .ctl{stroke:#475569} .ex{stroke:#8b5cf6} .ev{stroke:#10b981}
      .fut{stroke:#f43f5e;stroke-dasharray:6 7;animation:dash 1.5s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-16}}
      @media (prefers-reduced-motion: reduce){.flow,.fut{animation:none}}
    </style>
    <marker id="mc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="mx" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
    <marker id="me" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
    <marker id="mf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="672" fill="#eef2f7" rx="18"/>
  <text x="40" y="38" font-size="20" font-weight="800" fill="#0f172a">AgentBot · 執行期拓樸（Runtime Topology）</text>
  <text x="40" y="59" class="s">三個程序；Redis 是「永遠在線的 Core」與「吃 GPU 的 VLA Worker」之間的接縫。上下兩條平行軌道＝任務與事件，互不交叉。</text>

  <!-- 1 User -->
  <rect x="70" y="80" width="290" height="52" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="1.6"/>
  <text class="h" x="90" y="103">1 · User Input</text>
  <text class="s" x="90" y="121">語音 · 文字 · UI / 按鈕</text>

  <!-- Core process -->
  <rect class="proc" x="40" y="156" width="350" height="392" rx="16"/>
  <text x="58" y="178" font="700 12px ui-monospace,monospace" font-weight="700" font-size="12" fill="#64748b">AgentBot Core · 單一程序（任意 Python 環境）</text>

  <rect x="74" y="192" width="282" height="40" rx="11" fill="#fff" stroke="#64748b" stroke-width="1.6"/>
  <text class="h" x="92" y="217">Gateway <tspan class="s" font-weight="400">(1→2 正規化)</tspan></text>

  <rect x="74" y="244" width="282" height="88" rx="11" fill="#fff" stroke="#6366f1" stroke-width="1.6"/>
  <text class="h" x="92" y="268">2 · Brain / ClawBot</text>
  <text class="s" x="92" y="287">LLM（Qwen3-VL，可插拔）· Memory</text>
  <text class="s" x="92" y="305">理解 · 推理(CoT) · 規劃 · 選技能</text>
  <text class="s" x="92" y="323">輸出 = SkillPlan（結構化）</text>

  <rect x="74" y="344" width="282" height="52" rx="11" fill="#fff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text class="h" x="92" y="366">4 · Skill Layer</text>
  <text class="s" x="92" y="384">sort_can · pour_water …（語意動作工具）</text>

  <rect x="74" y="406" width="282" height="52" rx="11" fill="#fff" stroke="#10b981" stroke-width="1.6"/>
  <text class="h" x="92" y="428">3 · Monitor</text>
  <text class="s" x="92" y="446">Ingestor · SafetyWatchdog · StateStore</text>

  <rect x="74" y="470" width="282" height="46" rx="11" fill="#fff" stroke="#0284c7" stroke-width="1.6"/>
  <text class="h" x="92" y="493">API + Console</text>
  <text class="s" x="92" y="509" font-size="11">HTTP · WebSocket · /v1/events</text>

  <!-- Redis -->
  <text class="h" x="450" y="322" fill="#b45309">Redis</text>
  <rect x="450" y="330" width="150" height="160" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <rect x="464" y="342" width="122" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
  <text class="tag" x="476" y="360" fill="#8b5cf6">List</text><text class="s" x="476" y="376" font-size="11">vla:tasks 佇列</text>
  <rect x="464" y="392" width="122" height="40" rx="8" fill="#fff" stroke="#fdba74"/>
  <text class="tag" x="476" y="410" fill="#10b981">Streams</text><text class="s" x="476" y="426" font-size="11">events 事件</text>
  <rect x="464" y="442" width="122" height="38" rx="8" fill="#fff" stroke="#fdba74"/>
  <text class="tag" x="476" y="459" fill="#0284c7">Hash</text><text class="s" x="476" y="475" font-size="11">state 即時</text>

  <!-- Worker process -->
  <rect class="proc" x="650" y="156" width="490" height="276" rx="16"/>
  <text font-weight="700" font-size="12" fill="#64748b" x="668" y="178">VLA Worker · env_isaaclab 程序（GPU）</text>

  <rect x="678" y="192" width="436" height="90" rx="11" fill="#fff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text class="h" x="698" y="216">5 · VLA Execution Engine</text>
  <text class="s" x="698" y="236">isaac_runner.run_rollout — IsaacLab</text>
  <text class="s" x="698" y="254">obs → get_action → step ×16 → success</text>
  <text class="s" x="698" y="272">System 2（policy）+ System 1（control）</text>

  <rect x="678" y="294" width="436" height="38" rx="11" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text class="h" x="698" y="318" font-size="13.5">policy_server — 啟動 / 健康檢查</text>

  <rect x="678" y="342" width="436" height="34" rx="11" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="s" x="698" y="364" font-size="11.5">沿用 scripts/eval/utils（joint_mapper · filter · saver）</text>

  <!-- GR00T server -->
  <rect x="650" y="452" width="490" height="50" rx="12" fill="#fff" stroke="#6366f1" stroke-width="1.6"/>
  <text class="h" x="670" y="474">GR00T policy server</text>
  <text class="s" x="670" y="492">ZMQ :5555 · 自有 venv（沿用既有）</text>

  <!-- Future hardware -->
  <rect class="proc" x="650" y="524" width="490" height="54" stroke="#f43f5e" rx="14"/>
  <text class="h" x="670" y="548" fill="#be123c">6 · 7　未來 — 實機</text>
  <text class="s" x="670" y="566" font-size="11.5">backends/hardware → gr00t_control_robot.py + openarm_ros2（ROS2）</text>

  <!-- ===== FLOWS ===== -->
  <!-- User -> Gateway -->
  <path class="flow ctl" d="M215,132 L215,192" marker-end="url(#mc)"/>
  <text class="lab" x="224" y="168" fill="#475569">HTTP/WS · POST /v1/chat</text>
  <!-- internal control -->
  <path class="flow ctl" d="M215,232 L215,244" marker-end="url(#mc)"/>
  <path class="flow ctl" d="M215,332 L215,344" marker-end="url(#mc)"/>
  <text class="lab" x="224" y="342" fill="#475569">SkillPlan</text>
  <!-- Monitor -> Console -->
  <path class="flow ev" d="M300,458 L300,470" marker-end="url(#me)"/>

  <!-- TASK rail (violet, y≈363) : Skills -> Redis:List -> Worker -->
  <path class="flow ex" d="M356,366 L450,362" marker-end="url(#mx)"/>
  <text class="lab" x="360" y="356" fill="#7c3aed">LPUSH VlaTaskRequest</text>
  <path class="flow ex" d="M600,362 L650,366" marker-end="url(#mx)"/>
  <text class="lab" x="606" y="356" fill="#7c3aed">BRPOP → run_rollout</text>

  <!-- EVENT rail (green, y≈414) : Worker -> Redis:Streams -> Monitor -->
  <path class="flow ev" d="M650,416 L600,412" marker-end="url(#me)"/>
  <text class="lab" x="606" y="406" fill="#059669">XADD telemetry / result</text>
  <path class="flow ev" d="M450,412 L356,430" marker-end="url(#me)"/>
  <text class="lab" x="372" y="404" fill="#059669">XREAD</text>

  <!-- feedback (green) on the left gutter, avoids Skills -->
  <path class="flow ev" d="M74,432 L56,432 L56,288 L74,288" marker-end="url(#me)"/>
  <text class="s" x="30" y="364" fill="#059669" transform="rotate(-90 30,364)">feedback 迴授</text>

  <!-- Worker -> GR00T -->
  <path class="flow ctl" d="M895,432 L895,452" marker-end="url(#mc)"/>
  <text class="lab" x="905" y="446" fill="#475569">ZMQ :5555 · get_action</text>

  <!-- GR00T -> future HW -->
  <path class="fut" d="M895,502 L895,524" marker-end="url(#mf)"/>
  <text class="lab" x="905" y="518" fill="#be123c">未來：改走 backends/hardware（不經模擬）</text>

  <!-- ===== integrated legend ===== -->
  <rect x="40" y="600" width="1100" height="52" rx="10" fill="#fff" stroke="#d6deea"/>
  <text class="s" x="56" y="620" font-weight="700" fill="#334155">圖例</text>
  <circle cx="116" cy="616" r="6" fill="#0ea5e9"/><text class="s" x="128" y="620">1 User</text>
  <circle cx="192" cy="616" r="6" fill="#6366f1"/><text class="s" x="204" y="620">2 Brain</text>
  <circle cx="274" cy="616" r="6" fill="#10b981"/><text class="s" x="286" y="620">3 Monitor</text>
  <circle cx="368" cy="616" r="6" fill="#8b5cf6"/><text class="s" x="380" y="620">4 Skill / 5 VLA</text>
  <circle cx="496" cy="616" r="6" fill="#f59e0b"/><text class="s" x="508" y="620">Redis</text>
  <circle cx="566" cy="616" r="6" fill="#f43f5e"/><text class="s" x="578" y="620">6·7 未來</text>
  <line x1="56" y1="640" x2="86" y2="640" stroke="#475569" stroke-width="3" stroke-dasharray="9 7"/><text class="s" x="92" y="644">control</text>
  <line x1="170" y1="640" x2="200" y2="640" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="9 7"/><text class="s" x="206" y="644">execution（jobs）</text>
  <line x1="344" y1="640" x2="374" y2="640" stroke="#10b981" stroke-width="3" stroke-dasharray="9 7"/><text class="s" x="380" y="644">events / feedback</text>
  <line x1="512" y1="640" x2="542" y2="640" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 7"/><text class="s" x="548" y="644">未來（虛線框）</text>
  <text class="s" x="700" y="644" fill="#334155">虛線「流動方向」＝資料流方向；實線方框＝元件，破折框＝程序邊界 / 未來。</text>
</svg>
