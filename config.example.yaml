# =============================================================================
#  IsaacLab-GR00T automation pipeline — configuration template
#
#  Copy this file to `config.yaml` (gitignored) and fill in the real values.
#  Secrets:
#    * Pegasus (training server) password  -> env var  PEGASUS_PASSWORD
#      (its default already lives in pegasus.py; never commit it here)
#    * asus-4090 password -> may live in config.yaml (LAN-only credential)
# =============================================================================

pegasus:                       # remote H100 training box (Jupyter HTTP/WebSocket, NOT ssh)
  # base_url comes from $PEGASUS_BASE (default in pegasus.py); password from $PEGASUS_PASSWORD
  state_root: /data/VLA/tingying/pegasus_runs   # server-side scratch for run state/logs

# Which training stack to drive. Override at runtime with: pipeline_runner.py --profile n1d5
active_profile: n1d7

profiles:
  # ----- GR00T N1.5 (conda) --------------------------------------------------
  n1d5:
    train_cwd: /data/VLA/tingying/IsaacLab-GR00T/Isaac-GR00T
    env_activate: 'eval "$(/home/gallop/miniforge3/bin/conda shell.bash hook)" && conda activate /data/VLA/tingying/envs/gr00t_n1d5'
    import_check: 'python3 -c "import gr00t"'
    dataset_path: /data/VLA/datasets/OpenArm_O6_CanSorting_Dataset_0408
    output_dir: /data/VLA/experiments/openarmlinkerhando6-can-sorting-checkpoints/new_embodiment/N1_5_100k_dataset_0408_rtc_stage1
    max_steps: 100000
    # Placeholders {gpu} {dataset_path} {output_dir} {max_steps} are substituted by the runner.
    train_cmd_template: >
      TOKENIZERS_PARALLELISM=false CUDA_VISIBLE_DEVICES={gpu} OPENBLAS_NUM_THREADS=4
      OMP_NUM_THREADS=4 MPLBACKEND=Agg python3 scripts/gr00t_finetune.py
      --dataset-path {dataset_path} --output-dir {output_dir} --gpu-id {gpu}
      --num-gpus 1 --batch-size 32 --video-backend torchvision_av
      --data-config openarm_linkerhand_o6 --embodiment_tag new_embodiment
      --max-steps {max_steps} --save-steps 2000 --eval_steps 1000 --save-total-limit 5
      --eval-args-trajs 2 --eval-args-max-steps 400 --dataset-split-ratio "9:1"
      --dataloader-num-workers 4 --denoising_step 4 --learning-rate 1e-4
      --eval-args-action-horizon 16

  # ----- GR00T N1.7 (uv) — DEFAULT; confirm/edit flags to match your run ------
  n1d7:
    train_cwd: /data/VLA/tingying/IsaacLab-GR00T/Isaac-GR00T_n1d7
    env_activate: 'true'       # uv needs no activation; `uv run` resolves the synced venv
    import_check: 'uv run python -c "import gr00t"'
    dataset_path: /data/VLA/datasets/OpenArm_O6_CanSorting_Dataset_0408
    output_dir: /data/VLA/experiments/openarmlinkerhando6-can-sorting-checkpoints/new_embodiment/N1_7_100k_dataset_0408_stage1
    max_steps: 100000
    train_cmd_template: >
      CUDA_VISIBLE_DEVICES={gpu} uv run python gr00t/experiment/launch_finetune.py
      --base-model-path nvidia/GR00T-N1.7-3B --dataset-path {dataset_path}
      --output-dir {output_dir} --embodiment-tag new_embodiment --num-gpus 1
      --max-steps {max_steps} --save-steps 2000 --save-total-limit 5
      --global-batch-size 32 --learning-rate 1e-4 --wandb-project finetune-gr00t-n1d7

training:
  gpu_idle_threshold_util: 10      # %  — GPU counts as idle when utilization < this
  gpu_idle_threshold_mem_gb: 5.0   # GB — AND memory used < this
  gpu_poll_interval_min: 30        # re-check interval while both GPUs are busy
  monitor_interval_sec: 300        # training-log poll cadence (5 min)
  connect_retry_max: 3             # SSH/Pegasus connect retries
  connect_retry_interval_sec: 10

local:
  download_dir: D:\tmp\IsaacLab-GR00T\artifacts\checkpoints   # where the verified .zip lands

asus4090:                          # local sim box, reachable only on OMAP-Motion-5G LAN
  host: 192.168.32.185
  user: asus
  password: "<set-in-config.yaml>" # LAN-only; real value goes in config.yaml, or env ASUS4090_PASSWORD
  deploy_dir: /home/asus/Gits/IsaacLab-GR00T/artifacts/checkpoints/gr00t/
  retry_max: 3

wifi:
  external: cj          # CJ86GJI4_5G   (internet / reaches Pegasus)
  local: omap           # OMAP-Motion-5G (LAN / reaches asus-4090)
  internet_check_ip: 8.8.8.8
  net_ready_timeout_sec: 60
