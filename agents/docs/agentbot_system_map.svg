<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 860" font-family="-apple-system,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Noto Serif CJK TC',sans-serif" role="img" aria-label="AgentBot 系統地圖（七個區塊）">
  <defs>
    <style>
      .h{font-weight:700;font-size:16px;fill:#1f2937}
      .h2{font-weight:700;font-size:14px;fill:#1f2937}
      .s{font-size:12px;fill:#586577}
      .chip{font-size:12px;fill:#334155}
      .flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 8;animation:dash 1s linear infinite}
      .instr{stroke:#0ea5e9} .skill{stroke:#8b5cf6} .act{stroke:#6366f1} .evt{stroke:#10b981}
      .fut{fill:none;stroke:#f43f5e;stroke-dasharray:7 8;animation:dash 1.6s linear infinite}
      .safe{fill:none;stroke:#f43f5e;stroke-width:3;stroke-dasharray:4 6;animation:dash .7s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-18}}
      @media (prefers-reduced-motion: reduce){.flow,.fut,.safe{animation:none}}
    </style>
    <marker id="i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
  </defs>

  <rect x="0" y="0" width="1060" height="860" fill="#eef2f7" rx="18"/>
  <text x="40" y="40" font-size="21" font-weight="800" fill="#0f172a">AgentBot · 系統地圖（System Map）</text>
  <text x="40" y="62" class="s">自然語言 → 大腦推理規劃 → 選技能 → 驅動 VLA 執行；Monitor 觀測全層並迴授。虛線沿箭頭流動＝資料流方向。</text>

  <!-- ===== Monitor rail (block 3, left) ===== -->
  <rect x="40" y="196" width="216" height="402" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text class="h" x="60" y="224" fill="#047857">3 · Monitor / Event Bus</text>
  <text class="s" x="60" y="246">即時觀測全層 + 迴授迴路</text>
  <rect x="58" y="262" width="180" height="40" rx="8" fill="#fff" stroke="#a7f3d0"/><text class="chip" x="70" y="280">機器人狀態</text><text class="s" x="70" y="296" font-size="10.5">running / blocked / fail</text>
  <rect x="58" y="312" width="180" height="40" rx="8" fill="#fff" stroke="#a7f3d0"/><text class="chip" x="70" y="330">環境</text><text class="s" x="70" y="346" font-size="10.5">物件 / 人 / 場景</text>
  <rect x="58" y="362" width="180" height="40" rx="8" fill="#fff" stroke="#fecaca"/><text class="chip" x="70" y="380" fill="#b91c1c">安全 Safety</text><text class="s" x="70" y="396" font-size="10.5">碰撞 / 緊急 / 違規</text>
  <rect x="58" y="412" width="180" height="40" rx="8" fill="#fff" stroke="#a7f3d0"/><text class="chip" x="70" y="430">系統狀態</text><text class="s" x="70" y="446" font-size="10.5">電量 / 溫度 / 頻寬</text>
  <rect x="58" y="470" width="180" height="110" rx="8" fill="#f0fdf4" stroke="#a7f3d0"/>
  <text class="h2" x="70" y="492" fill="#047857">迴授 Feedback</text>
  <text class="s" x="70" y="512" font-size="11">資料 / 感測</text><text class="s" x="70" y="530" font-size="11">狀態 / 結果</text>
  <text class="s" x="70" y="548" font-size="11">成功 / 失敗</text><text class="s" x="70" y="566" font-size="11">interrupt（中斷）</text>

  <!-- ===== Main column (blocks 1,2,4,5,6,7) ===== -->
  <!-- 1 User -->
  <rect x="320" y="80" width="440" height="92" rx="14" fill="#fff" stroke="#0ea5e9" stroke-width="1.8"/>
  <text class="h" x="340" y="106">1 · User Input Layer</text>
  <rect x="340" y="118" width="126" height="42" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text class="chip" x="354" y="136">語音</text><text class="s" x="354" y="152" font-size="10.5">ASR / TTS</text>
  <rect x="476" y="118" width="126" height="42" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text class="chip" x="490" y="136">文字</text><text class="s" x="490" y="152" font-size="10.5">Chat / Command</text>
  <rect x="612" y="118" width="128" height="42" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text class="chip" x="626" y="136">UI / 按鈕</text><text class="s" x="626" y="152" font-size="10.5">App / Panel</text>

  <!-- 2 Brain -->
  <rect x="320" y="206" width="440" height="158" rx="14" fill="#fff" stroke="#6366f1" stroke-width="2"/>
  <text class="h" x="340" y="232">2 · Brain / ClawBot（大腦）</text>
  <rect x="340" y="244" width="200" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/><text class="h2" x="352" y="263">LLM</text><text class="s" x="352" y="281" font-size="11">Qwen3-VL（可插拔）</text>
  <rect x="550" y="244" width="190" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/><text class="h2" x="562" y="263">Memory</text><text class="s" x="562" y="281" font-size="11">對話 / 情節 / 語意</text>
  <rect x="340" y="298" width="400" height="26" rx="7" fill="#f8faff" stroke="#e0e7ff"/><text class="s" x="352" y="316" font-size="11.5">理解 · 推理(CoT) · 規劃(High-level) · 選技能 · 對話</text>
  <rect x="340" y="330" width="400" height="24" rx="7" fill="#eef2ff" stroke="#c7d2fe"/><text class="s" x="352" y="347" font-size="11.5" fill="#4338ca">⤷ 結構化輸出 SkillPlan：intent · goal · skill calls · params · safety_flags</text>

  <!-- 4 Skill -->
  <rect x="320" y="398" width="440" height="86" rx="14" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="h" x="340" y="424">4 · Skill Layer（語意動作工具）</text>
  <rect x="340" y="436" width="118" height="36" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/><text class="chip" x="354" y="459">sort_can</text>
  <rect x="468" y="436" width="118" height="36" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/><text class="chip" x="482" y="459">pour_water</text>
  <rect x="596" y="436" width="144" height="36" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/><text class="s" x="610" y="459" font-size="11">…可重用、含參數/約束</text>

  <!-- 5 VLA -->
  <rect x="320" y="518" width="440" height="118" rx="14" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="h" x="340" y="544">5 · VLA Execution Engine</text>
  <text class="s" x="340" y="562">GR00T + IsaacLab（沿用 scripts/eval）</text>
  <rect x="340" y="572" width="200" height="50" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/><text class="h2" x="352" y="591">System 2 · Policy</text><text class="s" x="352" y="609" font-size="11">GR00T 推論（思考/規劃）</text>
  <rect x="550" y="572" width="190" height="50" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/><text class="h2" x="562" y="591">System 1 · Control</text><text class="s" x="562" y="609" font-size="11">即時閉環控制</text>

  <!-- 6 Robot Control (future) -->
  <rect x="320" y="670" width="440" height="70" rx="14" fill="#fff5f5" stroke="#f43f5e" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text class="h" x="340" y="696" fill="#be123c">6 · Robot Control（low-level）<tspan class="s" font-weight="400" fill="#9f1239">　未來</tspan></text>
  <text class="s" x="340" y="722">運動 · 夾爪 · 底盤 · 全身控制　|　Emergency Stop（緊急停止覆寫）</text>

  <!-- 7 Physical (future) -->
  <rect x="320" y="760" width="440" height="64" rx="14" fill="#fff5f5" stroke="#f43f5e" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text class="h" x="340" y="786" fill="#be123c">7 · Physical World<tspan class="s" font-weight="400" fill="#9f1239">　未來</tspan></text>
  <text class="s" x="340" y="810">機器人 · 物件 · 人 · 環境（OpenArm via openarm_ros2）</text>

  <!-- ===== main vertical flows ===== -->
  <path class="flow instr" d="M540,172 L540,206" marker-end="url(#i)"/><text class="s" x="548" y="193" fill="#0284c7" font-size="11">指令 instruction</text>
  <path class="flow skill" d="M540,364 L540,398" marker-end="url(#k)"/><text class="s" x="548" y="385" fill="#7c3aed" font-size="11">skill calls</text>
  <path class="flow skill" d="M540,484 L540,518" marker-end="url(#k)"/><text class="s" x="548" y="505" fill="#7c3aed" font-size="11">VlaTaskRequest</text>
  <path class="fut" d="M540,636 L540,670" marker-end="url(#r)"/><text class="s" x="548" y="657" fill="#be123c" font-size="11">actions（未來實機）</text>
  <path class="fut" d="M540,740 L540,760" marker-end="url(#r)"/>

  <!-- ===== monitor flows ===== -->
  <!-- VLA -> Monitor (state/telemetry) -->
  <path class="flow evt" d="M320,560 C286,560 280,500 256,470" marker-end="url(#g)"/>
  <text class="s" x="262" y="556" fill="#059669" font-size="11">狀態 / 遙測</text>
  <!-- Monitor -> Brain (feedback up) -->
  <path class="flow evt" d="M256,300 C286,300 296,288 320,286" marker-end="url(#g)"/>
  <text class="s" x="262" y="292" fill="#059669" font-size="11">迴授</text>
  <!-- Safety: Monitor -> Robot Control (immediate stop) -->
  <path class="safe" d="M150,598 L150,705 L320,705" marker-end="url(#r)"/>
  <text class="s" x="160" y="660" fill="#be123c" font-size="11">立即安全停止</text>

  <!-- ===== integrated legend / core concepts (right) ===== -->
  <rect x="788" y="206" width="232" height="430" rx="14" fill="#fff" stroke="#d6deea"/>
  <text class="h2" x="806" y="232" fill="#334155">核心概念 / 圖例</text>
  <text class="s" x="806" y="258" font-size="11.5"><tspan font-weight="700" fill="#4338ca">大腦＝Agent</tspan>：高階推理、</text>
  <text class="s" x="806" y="274" font-size="11.5">規劃、記憶、選技能。</text>
  <text class="s" x="806" y="298" font-size="11.5"><tspan font-weight="700" fill="#7c3aed">技能＝語意工具</tspan>：可重用</text>
  <text class="s" x="806" y="314" font-size="11.5">原子動作 + 參數/約束。</text>
  <text class="s" x="806" y="338" font-size="11.5"><tspan font-weight="700" fill="#7c3aed">VLA＝執行引擎</tspan>：結合</text>
  <text class="s" x="806" y="354" font-size="11.5">System 2（policy）與</text>
  <text class="s" x="806" y="370" font-size="11.5">System 1（control）。</text>

  <line x1="806" y1="396" x2="838" y2="396" class="flow instr" marker-end="url(#i)"/><text class="s" x="846" y="400" font-size="11">指令 instruction</text>
  <line x1="806" y1="422" x2="838" y2="422" class="flow skill" marker-end="url(#k)"/><text class="s" x="846" y="426" font-size="11">skill / task（資料流）</text>
  <line x1="806" y1="448" x2="838" y2="448" class="flow act" marker-end="url(#a)"/><text class="s" x="846" y="452" font-size="11">action flow</text>
  <line x1="806" y1="474" x2="838" y2="474" class="flow evt" marker-end="url(#g)"/><text class="s" x="846" y="478" font-size="11">事件 / 迴授</text>
  <line x1="806" y1="500" x2="838" y2="500" class="safe" marker-end="url(#r)"/><text class="s" x="846" y="504" font-size="11">立即安全（紅）</text>
  <line x1="806" y1="526" x2="838" y2="526" class="fut" marker-end="url(#r)"/><text class="s" x="846" y="530" font-size="11">未來實機路徑</text>

  <rect x="806" y="548" width="196" height="74" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="s" x="818" y="568" font-size="11" font-weight="700" fill="#334155">本次交付（Phase 0）</text>
  <text class="s" x="818" y="586" font-size="11">已建：1·2·4·5 + 3（模擬）</text>
  <text class="s" x="818" y="603" font-size="11">未來：6·7（實機，虛線）</text>
  <text class="s" x="818" y="616" font-size="10.5" fill="#94a3b8">破折框＝未來 / 程序邊界</text>
</svg>
